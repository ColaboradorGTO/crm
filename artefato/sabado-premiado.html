<title>Sábado Premiado</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;600;700&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@600;700&display=swap">
<style>
/* Sábado Premiado · Tesoura de Ouro
   Layout: LP mobile first sobre o azul do MIV; admin, dash e balcão em painéis claros com barra azul.
   Tema único e claro por escolha (identidade da marca), cores todas explícitas. */
:root {
  --azul: #001D7E;
  --azul2: #0B2A93;
  --azul-esc: #00124F;
  --ouro: #BF9556;
  --ouro-esc: #9C7438;
  --creme: #F5E2C4;
  --cinza: #858DA0;
  --tinta: #0D1540;
  --muted: #59618A;
  --fundo: #F3F4F9;
  --papel: #FFFFFF;
  --linha: #DDE1EE;
  --ok: #1F7A4D;
  --ok-bg: #E4F3EA;
  --alerta: #A86400;
  --alerta-bg: #FBF0DD;
  --erro: #B42318;
  --erro-bg: #FCE8E6;
  --f-titulo: "Raleway", "Helvetica Neue", Arial, sans-serif;
  --f-texto: "Roboto", "Helvetica Neue", Arial, sans-serif;
  --f-cod: "Roboto Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box }
html, body { background: var(--fundo); color: var(--tinta) }
body { margin: 0; font: 15px/1.5 var(--f-texto); -webkit-font-smoothing: antialiased }
h1, h2, h3 { font-family: var(--f-titulo); text-wrap: balance; margin: 0; color: var(--azul) }
button, input, select, textarea { font: inherit; color: inherit }
a { color: var(--azul2) }
:focus-visible { outline: 2px solid var(--ouro); outline-offset: 2px }
.num { font-variant-numeric: tabular-nums }
.muted { color: var(--muted) }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

/* botões e campos */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; border-radius: 8px; padding: 10px 16px; font-weight: 600; cursor: pointer; background: var(--azul); color: #fff; text-decoration: none; white-space: nowrap }
.btn:hover { background: var(--azul2) }
.btn.ouro { background: var(--ouro); color: var(--azul-esc) }
.btn.ouro:hover { background: #CDA466 }
.btn.sec { background: var(--papel); color: var(--azul); border-color: #C7CDE2 }
.btn.sec:hover { background: #EEF0F8 }
.btn.peq { padding: 6px 10px; font-size: 13px; border-radius: 6px }
.btn.perigo { background: var(--papel); color: var(--erro); border-color: #EBC3BE }
.btn[disabled] { opacity: .55; cursor: not-allowed }
.campo { display: grid; gap: 5px; min-width: 0 }
.campo label { font-size: 12.5px; font-weight: 600; color: var(--muted); letter-spacing: .02em }
.campo input, .campo select, .campo textarea { width: 100%; border: 1px solid #C7CDE2; border-radius: 8px; padding: 10px 12px; background: var(--papel) }
.campo textarea { min-height: 110px; font-family: var(--f-cod); font-size: 13px }
.campo input:focus, .campo select:focus, .campo textarea:focus { border-color: var(--azul); outline: none; box-shadow: 0 0 0 3px rgba(0, 29, 126, .12) }
.campo .dica { font-size: 12px; color: var(--muted) }
.campo.erro input { border-color: var(--erro) }
.campo .msg-erro { font-size: 12.5px; color: var(--erro) }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--muted) }
.check input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--azul) }
.aviso { border-radius: 8px; padding: 10px 14px; font-size: 14px }
.aviso.ok { background: var(--ok-bg); color: var(--ok) }
.aviso.alerta { background: var(--alerta-bg); color: var(--alerta) }
.aviso.erro { background: var(--erro-bg); color: var(--erro) }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; white-space: nowrap }
.pill.ok { background: var(--ok-bg); color: var(--ok) }
.pill.alerta { background: var(--alerta-bg); color: var(--alerta) }
.pill.erro { background: var(--erro-bg); color: var(--erro) }
.pill.neutro { background: #ECEEF6; color: var(--muted) }
.pill.ouro { background: #F6ECDD; color: var(--ouro-esc) }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--azul-esc); color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 14px; z-index: 50; box-shadow: 0 8px 24px rgba(0, 18, 79, .25) }
.demo-faixa { background: var(--ouro); color: var(--azul-esc); font-size: 12.5px; font-weight: 600; text-align: center; padding: 6px 16px }
.demo-faixa a { color: var(--azul-esc) }

/* ---------- LP da influencer ---------- */
.lp { min-height: 100vh; background: var(--azul); color: #fff }
.lp-topo { padding-block: 22px 0; display: flex; justify-content: center }
.lp-topo img { height: 34px; width: auto }
.lp-hero { max-width: 460px; margin: 0 auto; padding-block: 26px 22px; text-align: center; display: grid; gap: 14px; justify-items: center }
.lp-foto { width: 108px; height: 108px; border-radius: 50%; border: 3px solid var(--ouro); object-fit: cover; background: var(--azul2); display: grid; place-items: center; font: 300 44px var(--f-titulo); color: var(--creme) }
.lp-eb { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--ouro); font-weight: 700 }
.lp-hero h1 { color: #fff; font-weight: 300; font-size: clamp(30px, 8vw, 40px); line-height: 1.1 }
.lp-hero h1 b { font-weight: 700; color: var(--creme) }
.lp-hero p { margin: 0; color: rgba(255, 255, 255, .84); max-width: 36ch }
.lp-data { display: inline-flex; gap: 10px; flex-wrap: wrap; justify-content: center }
.lp-data span { border: 1px solid color-mix(in srgb, var(--ouro) 60%, transparent); color: var(--creme); border-radius: 999px; padding: 5px 12px; font-size: 13px }
.lp-card { max-width: 460px; margin: 0 auto; background: var(--papel); color: var(--tinta); border-radius: 16px 16px 0 0; padding: 24px 20px calc(28px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px }
.lp-card h2 { font-size: 20px; font-weight: 600 }
.lp-passos { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; counter-reset: p }
.lp-passos li { counter-increment: p; display: grid; grid-template-columns: 26px 1fr; gap: 10px; font-size: 14px; color: var(--muted); align-items: start }
.lp-passos li::before { content: counter(p); width: 24px; height: 24px; border-radius: 50%; background: var(--creme); color: var(--azul); font-weight: 700; font-size: 13px; display: grid; place-items: center }
.lp-regras { font-size: 12px; color: var(--muted); text-align: center }
.lp-fim { text-align: center; font-size: 12px; color: rgba(255, 255, 255, .68); padding: 18px 16px 26px; background: var(--azul) }
.lp-termos { margin: 0 auto; max-width: 760px; text-align: center; font-size: 11.5px; line-height: 1.6; color: rgba(255, 255, 255, .78); padding: 0 16px 30px; background: var(--azul) }
.lp-termos a { color: #fff }
.lp-passos a { color: var(--azul); font-weight: 600 }

/* cupom emitido */
.cupom { border: 2px dashed var(--ouro); border-radius: 14px; padding: 18px; display: grid; gap: 10px; justify-items: center; text-align: center; background: #FFFBF5 }
.cupom small { font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--ouro-esc); font-weight: 700 }
.cupom .cod { font: 700 40px/1 var(--f-cod); color: var(--azul); letter-spacing: .06em }
.cupom .qr { background: #fff; padding: 8px; border-radius: 8px }
.cupom .qr img, .cupom .qr canvas { display: block; width: 150px; height: 150px }
.cupom .info { font-size: 13.5px; color: var(--muted) }
.cupom .info b { color: var(--tinta) }
.acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.acoes .btn { width: 100% }

/* ---------- área interna (admin, dash, balcão) ---------- */
.barra { background: var(--azul); color: #fff; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 25; background: var(--azul) }
.barra .wrap { display: flex; align-items: center; gap: 14px; padding-block: 12px; flex-wrap: wrap }
.barra img.tes { height: 26px; width: auto }
.barra .nome { font: 600 15px var(--f-titulo); color: var(--creme); margin-right: auto; white-space: nowrap }
.barra nav { display: flex; gap: 4px; flex-wrap: wrap }
.barra nav a { color: #D5DAF0; text-decoration: none; padding: 6px 10px; border-radius: 6px; font-size: 14px }
.barra nav a.on, .barra nav a:hover { background: rgba(255, 255, 255, .12); color: #fff }
.barra img.v4 { height: 18px; width: auto; opacity: .9 }
.pagina { padding-block: 24px 48px; display: grid; gap: 20px }
.cab { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap }
.cab h1 { font-size: 26px; font-weight: 400 }
.cab p { margin: 4px 0 0; color: var(--muted) }
.painel { background: var(--papel); border: 1px solid var(--linha); border-radius: 12px; padding: 18px; min-width: 0 }
.painel h2 { font-size: 17px; font-weight: 600; margin-bottom: 12px }
.grade { display: grid; gap: 14px }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)) }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)) }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)) }
@media (max-width: 860px) { .g3, .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
@media (max-width: 560px) { .g2, .g3, .g4 { grid-template-columns: 1fr } }
.abas { display: flex; gap: 4px; border-bottom: 1px solid var(--linha); flex-wrap: wrap }
.abas button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; cursor: pointer; color: var(--muted); font-weight: 600 }
.abas button.on { color: var(--azul); border-bottom-color: var(--ouro) }
.filtros { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end }
.filtros .campo { min-width: 180px }

/* tabelas */
.tab { overflow-x: auto; border: 1px solid var(--linha); border-radius: 10px; background: var(--papel) }
table { width: 100%; border-collapse: collapse; font-size: 14px }
th { text-align: left; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--linha); background: #F8F9FC; white-space: nowrap }
th.ord { cursor: pointer; user-select: none }
th.ord:hover { color: var(--azul) }
td { padding: 10px 12px; border-bottom: 1px solid #EEF0F6; vertical-align: middle }
tr:last-child td { border-bottom: 0 }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap }
td .sub { display: block; font-size: 12.5px; color: var(--muted) }
td code, .cod-inline { font: 600 13px var(--f-cod); color: var(--azul) }
.barra-meta { display: flex; align-items: center; gap: 8px; min-width: 130px }
.barra-meta .trilho { flex: 1; height: 8px; border-radius: 4px; background: #E6E9F3; overflow: hidden }
.barra-meta .trilho i { display: block; height: 100%; background: var(--azul) }
.barra-meta .trilho i.bateu { background: var(--ouro) }
.barra-meta span { font-size: 12.5px; min-width: 38px; text-align: right; font-variant-numeric: tabular-nums }

/* números do dash */
.kpi { display: grid; gap: 2px }
.kpi small { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700 }
.kpi b { font: 300 34px/1.1 var(--f-titulo); color: var(--azul); font-variant-numeric: tabular-nums }
.kpi span { font-size: 13px; color: var(--muted) }
.grafico svg { width: 100%; height: auto; display: block }
.grafico text { fill: var(--muted); font: 11px var(--f-texto) }
.legenda { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted) }
.legenda i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px }

/* modal */
.modal-fundo { position: fixed; inset: 0; background: rgba(0, 18, 79, .45); display: grid; place-items: center; padding: 16px; z-index: 40 }
.modal { background: var(--papel); border-radius: 14px; width: min(560px, 100%); max-height: 90vh; overflow: auto; padding: 22px; display: grid; gap: 14px }
.modal .rodape { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap }
.kit { background: #F8F9FC; border: 1px solid var(--linha); border-radius: 8px; padding: 12px; font-size: 13.5px; white-space: pre-wrap }

/* login e balcão */
.login { max-width: 380px; margin: 8vh auto; display: grid; gap: 14px; text-align: center }
.balcao { max-width: 620px; margin: 0 auto; width: 100% }
.busca { display: grid; grid-template-columns: 1fr auto; gap: 10px }
.busca input { font: 600 22px var(--f-cod); letter-spacing: .06em; text-transform: uppercase; padding: 14px }
.resultado { border-radius: 12px; padding: 18px; display: grid; gap: 12px; border: 2px solid var(--linha); background: var(--papel) }
.resultado.valido { border-color: #7BC59E; background: #F5FBF7 }
.resultado.invalido { border-color: #EBA59D; background: #FFF8F7 }
.resultado .grande { font: 700 28px/1.1 var(--f-cod); color: var(--azul) }
.dl { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; font-size: 14.5px }
.dl dt { color: var(--muted) }
.dl dd { margin: 0; font-weight: 600 }
.hist { display: grid; gap: 6px; font-size: 13.5px }
.hist div { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid #EEF0F6; padding: 6px 0 }
.inicio-cards { display: grid; gap: 14px; grid-template-columns: repeat(4, minmax(0, 1fr)) }
@media (max-width: 980px) { .inicio-cards { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
@media (max-width: 520px) { .inicio-cards { grid-template-columns: 1fr } }
.inicio-cards a { text-decoration: none; color: inherit }
.inicio-cards .painel:hover { border-color: var(--ouro) }
.inicio-cards h3 { font-size: 17px; margin-bottom: 4px }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
@media (max-width: 560px) { .barra img.v4 { display: none } .barra .nome { display: none } .cab h1 { font-size: 22px } }

/* ================= CRM: menu lateral fixo + área de trabalho ================= */
.crm { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh }
.lateral { background: var(--azul-esc); color: #C9CFEA; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 18px; padding: 20px 14px; overflow-y: auto }
.lateral .marca { display: grid; gap: 6px; padding: 0 8px 14px; border-bottom: 1px solid rgba(255, 255, 255, .1) }
.lateral .marca img { height: 30px; width: auto; justify-self: start }
.lateral .marca b { font: 600 15px var(--f-titulo); color: var(--creme) }
.lateral .marca span { font-size: 12px; color: #8E96C2 }
.menu { display: grid; gap: 2px }
.menu .grupo { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #7D86B8; font-weight: 700; padding: 12px 10px 6px }
.menu a { display: flex; align-items: center; gap: 10px; color: #C9CFEA; text-decoration: none; padding: 9px 10px; border-radius: 8px; font-size: 14.5px }
.menu a svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
.menu a:hover { background: rgba(255, 255, 255, .07); color: #fff }
.menu a.on { background: var(--azul); color: #fff; box-shadow: inset 3px 0 0 var(--ouro) }
.menu a .cont { margin-left: auto; font-size: 12px; color: #9EA6CC; font-variant-numeric: tabular-nums }
.lateral .pe { margin-top: auto; display: grid; gap: 10px; padding: 14px 8px 0; border-top: 1px solid rgba(255, 255, 255, .1); font-size: 12.5px }
.lateral .pe img { height: 18px; width: auto; opacity: .85 }
.lateral .pe button { background: none; border: 1px solid rgba(255, 255, 255, .2); color: #C9CFEA; border-radius: 6px; padding: 6px 10px; cursor: pointer; justify-self: start }
.lateral .pe .modo { color: var(--ouro); font-weight: 600 }
.trabalho { min-width: 0; display: flex; flex-direction: column }
.topo-crm { display: none }
.conteudo > * { min-width: 0 }
.conteudo { grid-template-columns: minmax(0, 1fr); padding: 26px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); max-width: 1240px; width: 100%; display: grid; gap: 20px; align-content: start }
@media (min-width: 901px) { .conteudo { padding-left: 32px; padding-right: 32px } }
@media (max-width: 900px) {
  .crm { grid-template-columns: 1fr }
  .lateral { position: fixed; inset: 0 auto 0 0; width: 272px; z-index: 45; transform: translateX(-100%); transition: transform .2s }
  .crm.aberto .lateral { transform: none; box-shadow: 0 0 0 100vmax rgba(0, 18, 79, .45) }
  .topo-crm { display: flex; align-items: center; gap: 12px; background: var(--azul-esc); color: #fff; padding: 10px max(16px, env(safe-area-inset-left, 0px)); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30 }
  .topo-crm button { background: none; border: 1px solid rgba(255, 255, 255, .25); color: #fff; border-radius: 6px; padding: 6px 10px; cursor: pointer }
  .topo-crm img { height: 22px; width: auto }
}
.titulo-pag { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap }
.titulo-pag h1 { font-size: 26px; font-weight: 400 }
.titulo-pag p { margin: 4px 0 0; color: var(--muted) }
.titulo-pag .acoes-pag { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end }
.volta { font-size: 13px; color: var(--muted); text-decoration: none }
.volta:hover { color: var(--azul) }

/* alertas da visão geral */
.alertas { display: grid; gap: 8px }
.alertas a, .alertas div { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 8px; font-size: 14px; text-decoration: none }

/* funil */
.funil { display: grid; gap: 10px }
.funil .et { display: grid; grid-template-columns: 150px 1fr 70px; gap: 12px; align-items: center; font-size: 14px }
.funil .et .tr { height: 26px; background: #EEF0F7; border-radius: 6px; overflow: hidden }
.funil .et .tr i { display: block; height: 100%; background: var(--azul); border-radius: 6px }
.funil .et:nth-child(1) .tr i { background: var(--ouro) }
.funil .et:nth-child(3) .tr i { background: var(--azul2) }
.funil .et b { text-align: right; font-variant-numeric: tabular-nums }
@media (max-width: 560px) { .funil .et { grid-template-columns: 1fr 60px } .funil .et .tr { grid-column: 1 / -1; order: 3 } }

/* quadro de etapas (kanban) */
.quadro { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(168px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 6px }
.coluna { background: #E9ECF5; border-radius: 10px; padding: 10px; display: grid; gap: 8px; align-content: start; min-height: 160px }
.coluna.sobre { outline: 2px dashed var(--ouro); outline-offset: -2px }
.coluna h3 { font: 700 12px var(--f-texto); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; padding: 2px 4px 4px }
.cartao { background: var(--papel); border: 1px solid var(--linha); border-radius: 8px; padding: 10px; display: grid; gap: 6px; cursor: grab; text-decoration: none; color: inherit }
.cartao:hover { border-color: var(--ouro) }
.cartao.arrastando { opacity: .5 }
.cartao b { font-size: 14px }
.cartao .sub { font-size: 12px; color: var(--muted) }
.alterna { display: inline-flex; border: 1px solid #C7CDE2; border-radius: 8px; overflow: hidden }
.alterna button { background: var(--papel); border: 0; padding: 8px 14px; cursor: pointer; color: var(--muted); font-weight: 600 }
.alterna button.on { background: var(--azul); color: #fff }

/* ficha da influencer */
.ficha-topo { display: flex; gap: 18px; align-items: center; flex-wrap: wrap }
.avatar { width: 72px; height: 72px; border-radius: 50%; background: var(--azul); color: var(--creme); display: grid; place-items: center; font: 300 30px var(--f-titulo); border: 3px solid var(--ouro); object-fit: cover; flex: none }
.avatar.peq { width: 34px; height: 34px; font-size: 15px; border-width: 2px }
.etapas-linha { display: flex; gap: 4px; flex-wrap: wrap }
.etapas-linha button { border: 1px solid #C7CDE2; background: var(--papel); border-radius: 999px; padding: 5px 12px; font-size: 12.5px; cursor: pointer; color: var(--muted) }
.etapas-linha button.feita { background: #F6ECDD; border-color: #E3CFA9; color: var(--ouro-esc) }
.etapas-linha button.on { background: var(--azul); border-color: var(--azul); color: #fff }

/* links e QR */
.links-grade { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)) }
.link-card { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 12px; align-items: center }
.link-card .qrm { background: #fff; border: 1px solid var(--linha); border-radius: 6px; padding: 4px; width: 84px; height: 84px }
.link-card .qrm img, .link-card .qrm canvas { width: 74px !important; height: 74px !important; display: block }
.link-card .u { font: 12.5px var(--f-cod); color: var(--azul2); word-break: break-all }
.link-card .bts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px }
tr.clicavel { cursor: pointer }
tr.clicavel:hover td { background: #F8F9FC }
.avatar svg { width: 32px; height: 32px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round }

/* fluxo do comparativo (passos da jornada) */
.fluxo { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px }
.fluxo .passo { position: relative; display: grid; gap: 2px; padding: 12px 14px; border-radius: 10px; background: #fff; border: 1px solid var(--linha, #E6E9F3) }
.fluxo .passo span { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--azul); color: #fff; font: 700 12px/1 var(--f-texto, inherit); margin-bottom: 4px }
.fluxo .passo:last-child span { background: #BF9556 }
.fluxo .passo b { font-size: 14px; color: var(--tinta) }
.fluxo .passo small { font-size: 12.5px; color: var(--muted) }
@media (max-width: 860px) { .fluxo { grid-template-columns: repeat(2, minmax(0, 1fr)) } }

/* seleção de influencers no formulário da loja */
.sel-inf { display: flex; flex-wrap: wrap; gap: 6px; min-height: 26px; align-items: center }
.lista-inf { display: grid; gap: 2px; max-height: 210px; overflow: auto; border: 1px solid var(--linha); border-radius: 8px; padding: 8px 10px; background: var(--fundo) }
.lista-inf .check { padding: 5px 0; cursor: pointer }
.lista-inf .check input:disabled + span { opacity: .75 }

/* foto da influencer no formulário */
.foto-up { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 14px; align-items: start }
.foto-prev { width: 88px; height: 88px; border-radius: 50%; overflow: hidden; background: var(--fundo); border: 1px solid var(--linha); display: grid; place-items: center; color: var(--azul); font: 300 34px/1 var(--f-titulo) }
.foto-prev img { width: 100%; height: 100%; object-fit: cover }

/* bandeiras: seletor no menu, ponto de cor e nome escrito (até chegar o logo oficial) */
.bandeiras { display: grid; gap: 2px; padding: 4px 12px 12px; border-bottom: 1px solid rgba(255, 255, 255, .12); margin-bottom: 6px }
.bandeiras button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: transparent; border: 0; color: rgba(255, 255, 255, .78); font: 500 13.5px var(--f-texto); padding: 7px 10px; border-radius: 7px; cursor: pointer }
.bandeiras button:hover { background: rgba(255, 255, 255, .08); color: #fff }
.bandeiras button.on { background: rgba(255, 255, 255, .14); color: #fff; font-weight: 700 }
.bandeiras i { width: 10px; height: 10px; border-radius: 50%; flex: none; box-shadow: 0 0 0 2px rgba(255, 255, 255, .15) }
.ponto { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .12) }
.wordmark { font: 400 22px/1.1 var(--f-titulo); letter-spacing: .01em; white-space: nowrap }
.wordmark b { font-weight: 800 }
.lp-topo .wordmark { font-size: 26px }
.lateral .marca .wordmark { font-size: 17px; display: block; color: #fff }
.lp-passos li > span { min-width: 0 }

</style>

<script>
// Funções comuns: CPF, telefone, dinheiro, datas e geração do prefixo do cupom.
window.U = (() => {
  const so = (s) => String(s || "").replace(/\D/g, "");
  const semAcento = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "");

  function cpfValido(c) {
    c = so(c);
    if (c.length !== 11 || /^(\d)\1{10}$/.test(c)) return false;
    for (let t = 9; t < 11; t++) {
      let s = 0;
      for (let i = 0; i < t; i++) s += +c[i] * (t + 1 - i);
      const d = ((s * 10) % 11) % 10;
      if (d !== +c[t]) return false;
    }
    return true;
  }
  const fmtCPF = (c) => { c = so(c).slice(0, 11); return c.replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})(\d{1,2})$/, "$1-$2"); };
  const mascaraCPF = (c) => { c = so(c); return c.length === 11 ? `***.${c.slice(3, 6)}.${c.slice(6, 9)}-**` : "***"; };
  const fmtTel = (t) => {
    t = so(t).slice(0, 11);
    if (t.length <= 2) return t;
    if (t.length <= 7) return `(${t.slice(0, 2)}) ${t.slice(2)}`;
    return `(${t.slice(0, 2)}) ${t.slice(2, t.length - 4)}-${t.slice(-4)}`;
  };
  const brl = (v) => (+v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 });
  const brl2 = (v) => (+v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  const n = (v) => (+v || 0).toLocaleString("pt-BR");
  const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
  const DIAS = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
  const dataBR = (iso) => { if (!iso) return ""; const [y, m, d] = String(iso).slice(0, 10).split("-"); return `${d}/${m}`; };
  const dataLonga = (iso) => { if (!iso) return ""; const d = new Date(String(iso).slice(0, 10) + "T12:00:00"); return `${DIAS[d.getDay()]} · ${dataBR(iso)}`; };
  const horaBR = (iso) => { if (!iso) return ""; const d = new Date(iso); return d.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }); };
  const hojeISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const primeiroNome = (nome) => String(nome || "").trim().split(/\s+/)[0] || "";

  // Prefixo do cupom: primeiro nome em maiúsculas, sem acento. Se já existe, primeiro nome + inicial do sobrenome; depois numera.
  function gerarPrefixo(nome, usados) {
    const partes = semAcento(nome).toUpperCase().replace(/[^A-Z ]/g, "").trim().split(/\s+/).filter(Boolean);
    if (!partes.length) return "";
    const base = partes[0].slice(0, 10);
    const set = new Set((usados || []).map((p) => String(p).toUpperCase()));
    if (!set.has(base)) return base;
    if (partes[1]) { const b2 = base + partes[1][0]; if (!set.has(b2)) return b2; }
    for (let i = 2; i < 100; i++) if (!set.has(base + i)) return base + i;
    return base + Date.now() % 1000;
  }
  const codigo = (prefixo, seq) => `${prefixo}${String(seq).padStart(3, "0")}`;
  const normCodigo = (s) => semAcento(s).toUpperCase().replace(/[^A-Z0-9]/g, "");
  const aleatorio = (n = 12) => Array.from(crypto.getRandomValues(new Uint8Array(n)), (b) => (b % 36).toString(36)).join("");

  // NFC-e: a chave de acesso tem 44 dígitos e vem no QR do cupom fiscal (parâmetro p=CHAVE|...).
  // cUF(2) AAMM(4) CNPJ(14) modelo(2) série(3) número(9) tpEmis(1) código(8) DV(1)
  function lerNFCe(texto) {
    const m = String(texto || "").match(/\d{44}/) || [so(texto)].filter((x) => x.length === 44);
    if (!m || !m[0]) return null;
    const k = m[0];
    return { chave: k, uf: k.slice(0, 2), aamm: k.slice(2, 6), cnpj: k.slice(6, 20), modelo: k.slice(20, 22), serie: +k.slice(22, 25), numero: +k.slice(25, 34) };
  }
  const fmtCNPJ = (c) => { c = so(c); return c.length === 14 ? c.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, "$1.$2.$3/$4-$5") : c; };
  // data em dd/mm/aaaa [hh:mm] ou ISO -> ISO
  function dataISO(t) {
    t = String(t || "").trim(); if (!t) return "";
    const br = t.match(/^(\d{2})\/(\d{2})\/(\d{4})(?:[ T](\d{2}):(\d{2}))?/);

    }

  function valorNum(t) {

  function acharLoja(lojas, txt, bandeira) {

    }

  }

        const inf = S.influencers.find((x) => x.prefixo.toLowerCase() === alvo || x.slug === alvo || U.semAcento(x.nome).toLowerCase() === alvo) || S.influencers.find((x) => U.semAcento(U.primeiroNome(x.nome)).toLowerCase() === alvo);

    // cruzamento por CPF: página da influencer x campanha de fim de ano (mesma conta de adm_comparativo no banco)
    comparativo(pin, sabadoId, band) {
      carregar();
      if (!admOk(pin)) return falha("Sessão expirada.");
      const fa = new Map();
      (S.fimdeano || []).filter((n) => !band || n.bandeira === band).forEach((n) => { const x = fa.get(n.cpf) || { notas: 0, valor: 0, lista: [] }; x.notas++; x.valor += +n.valor || 0; x.lista.push(n); fa.set(n.cpf, x); });
      const primeiro = new Map();
      S.cadastros.filter((c) => !band || c.bandeira === band).forEach((c) => { if (!primeiro.has(c.cpf) || c.criado_em < primeiro.get(c.cpf)) primeiro.set(c.cpf, c.criado_em); });
      const lp = new Map();
      S.cadastros.filter((c) => (!sabadoId || c.sabado_id === +sabadoId) && (!band || c.bandeira === band)).sort((a, b) => String(a.criado_em).localeCompare(b.criado_em)).forEach((c) => { if (!lp.has(c.cpf)) lp.set(c.cpf, c); });
      const t = { lp: lp.size, lp_usaram: 0, lp_valor_cupom: 0, fa_cpfs: fa.size, fa_notas: 0, fa_valor: 0, ambos: 0, ambos_notas: 0, ambos_valor: 0, ambos_pos_valor: 0, ambos_pos_notas: 0, ambos_usaram: 0, so_fa: 0, so_fa_valor: 0 };
      fa.forEach((x, cpf) => { t.fa_notas += x.notas; t.fa_valor += x.valor; if (!lp.has(cpf)) { t.so_fa++; t.so_fa_valor += x.valor; } });
      const porInf = new Map(), pessoas = [];

        if (c.status === "usado") { t.lp_usaram++; t.lp_valor_cupom += +c.valor || 0; }
        if (f) { t.ambos++; t.ambos_notas += f.notas; t.ambos_valor += f.valor; t.ambos_pos_valor += posValor; t.ambos_pos_notas += pos.length; if (c.status === "usado") t.ambos_usaram++; }
        const inf = porId(S.influencers, c.influencer_id);

        if (f) { z.ambos++; z.fa_notas += f.notas; z.fa_valor += f.valor; z.pos_valor += posValor; }
        porInf.set(inf.id, z);
        pessoas.push({ cpf: c.cpf, nome: c.nome, codigo: c.codigo, influencer: inf.nome, loja: (porId(S.lojas, c.loja_id) || {}).nome || "", cadastro: c.criado_em, status: c.status, valor_cupom: c.valor, fa_notas: f ? f.notas : 0, fa_valor: f ? f.valor : 0, pos_valor: posValor });
      });

<script>
// Bateria real: chama as funções (RPC) do banco definidas em ../supabase/schema.sql (PostgreSQL próprio da GTO ou Supabase).
// As tabelas ficam fechadas para o público; tudo passa por estas funções, que conferem PIN e regras no servidor.
//
// Resiliência (o resultado da ação depende de cada cadastro chegar ao banco):
//  - chamadas públicas (página da influencer) tentam de novo sozinhas se a rede ou o servidor falharem;
//  - cadastrar() pode ser repetido sem risco: o banco devolve o mesmo cupom para o mesmo CPF;
//  - nada que muda dados do CRM é repetido sozinho (evita contar duas vezes);
//  - arquivos grandes são enviados em blocos.
(() => {
  const C = window.CONFIG;
  if (C.MODO !== "supabase" && C.MODO !== "servidor") return;

  // Supabase: SUPABASE_URL + /rest/v1/rpc/. Servidor próprio (PostgREST): API_URL + /rpc/ (ex.: "/api", atrás do mesmo domínio).
  const BASE_RPC = C.API_URL ? `${C.API_URL.replace(/\/$/, "")}/rpc/` : `${String(C.SUPABASE_URL || "").replace(/\/$/, "")}/rest/v1/rpc/`;
  const AUTH = {};
  if (C.SUPABASE_ANON) { AUTH.apikey = C.SUPABASE_ANON; AUTH.Authorization = `Bearer ${C.SUPABASE_ANON}`; }
  const espera = (ms) => new Promise((ok) => setTimeout(ok, ms));
  const ATRASOS = [700, 1800, 4000, 8000];

  // uma tentativa: devolve o corpo ou lança Error (com .rede = true quando nem chegou ao servidor, .temporario = vale tentar de novo)
  async function uma(fn, args, { get, limite }) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), limite);
    let r;
    try {
      if (get) {
        const q = new URLSearchParams(Object.entries(args || {}).map(([k, v]) => [k, String(v)])).toString();
        r = await fetch(`${BASE_RPC}${fn}?${q}`, { method: "GET", headers: { ...AUTH }, signal: ctl.signal });
      } else {
        r = await fetch(BASE_RPC + fn, { method: "POST", headers: { "Content-Type": "application/json", ...AUTH }, body: JSON.stringify(args || {}), signal: ctl.signal });
      }
    } catch (e) {
      clearTimeout(t);
      const err = new Error(e.name === "AbortError" ? "O servidor demorou para responder." : "Sem conexão com a internet.");
      err.rede = true; err.temporario = true; throw err;
    }
    clearTimeout(t);
    const txt = await r.text();
    let corpo = null;
    try { corpo = txt ? JSON.parse(txt) : null; } catch (e) { corpo = null; } // página de erro do proxy (HTML) não é JSON
    if (!r.ok) {
      const temp = r.status === 429 || r.status >= 500;
      const msg = (corpo && (corpo.message || corpo.hint)) ||
        (r.status === 429 ? "Muitos acessos ao mesmo tempo. Aguarde alguns segundos." : r.status >= 500 ? "O servidor está ocupado. Tentando de novo." : "Erro no servidor. Tente de novo.");
      const err = new Error(msg); err.status = r.status; err.temporario = temp; err.sem_corpo = !corpo;
      err.naoProcessado = r.status === 429; // barrado pelo limite do nginx antes de chegar ao banco: repetir é seguro
      throw err;
    }
    return corpo;
  }

  // tentativas: 0 = uma só; n = até n repetições com espera crescente
  async function rpc(fn, args, { tentativas = 0, get = false, limite = 30000 } = {}) {
    let k = 0, bloqueios = 0;
    while (true) {
      try { return await uma(fn, args, { get, limite }); }
      catch (e) {
        // "muitos acessos" (429): o pedido nem chegou ao banco, então qualquer chamada pode ser repetida com segurança
        if (e.naoProcessado && bloqueios < 8) { bloqueios++; await espera(900 + bloqueios * 400); continue; }
        // erro com mensagem do banco (regra de negócio) nunca é repetido
        if (!e.temporario || k >= tentativas) throw e;
        await espera(ATRASOS[Math.min(k, ATRASOS.length - 1)]);
        k++;
      }
    }
  }

  // envia listas grandes em blocos; junta os totais. substituirSoPrimeiro: o "substituir tudo" só vale no 1º bloco.
  async function blocos(fn, pin, lista, tam, extra, somar, substituir) {
    const total = {};
    for (let i = 0; i < Math.max(1, lista.length); i += tam) {
      const r = await rpc(fn, { p_pin: String(pin), ...extra(i === 0 ? !!substituir : false), p: lista.slice(i, i + tam) }, { limite: 120000 });
      for (const k of somar) total[k] = (total[k] || 0) + (r[k] || 0);
      total.detalhes = (total.detalhes || []).concat(r.detalhes || []).slice(0, 12);
      for (const k of Object.keys(r)) if (!somar.includes(k) && k !== "detalhes") total[k] = r[k]; // totais finais do banco (do último bloco)
    }
    return total;
  }
  const dinheiro = (v) => (v === "" || v == null ? null : U.valorNum(v));

  window.API = {
    modo: C.MODO,
    // página pública: leitura em cache (GET) com repetição; o servidor guarda poucos segundos para aguentar pico de acessos
    lpInfo: (slug) => rpc("lp_info", { p_slug: String(slug || "").toLowerCase() }, { get: true, tentativas: 3, limite: 15000 }),
    cadastrar: (d) => rpc("cadastrar", { p_slug: String(d.slug).toLowerCase(), p_nome: d.nome, p_cpf: U.so(d.cpf), p_whatsapp: U.so(d.whatsapp), p_bairro: d.bairro || "", p_aceite: !!d.aceite }, { tentativas: 4, limite: 20000 }),
    balcaoEntrar: (pin) => rpc("balcao_entrar", { p_pin: String(pin) }, { tentativas: 1 }),
    balcaoBuscar: (pin, termo) => rpc("balcao_buscar", { p_pin: String(pin), p_termo: String(termo) }, { tentativas: 1 }),
    balcaoValidar: (pin, codigo, fiscal, valor) => rpc("balcao_validar", { p_pin: String(pin), p_codigo: U.normCodigo(codigo), p_cupom_fiscal: String(fiscal || ""), p_valor: dinheiro(valor) }),
    balcaoRecentes: (pin) => rpc("balcao_recentes", { p_pin: String(pin) }, { tentativas: 1 }),
    admEntrar: (pin) => rpc("adm_entrar", { p_pin: String(pin) }, { tentativas: 1 }),
    dados: (pin, sid, band) => rpc("adm_dados", { p_pin: String(pin), p_sabado: +sid || null, p_bandeira: band || null }, { tentativas: 2 }),
    fotoInfluencer: (pin, id) => rpc("adm_influencer_foto", { p_pin: String(pin), p_id: +id }, { tentativas: 1 }),
    // foto: só vai se mudou (undefined = o banco mantém a que já está)
    salvarInfluencer: (pin, o) => rpc("adm_salvar_influencer", { p_pin: String(pin), p: { ...o, whatsapp: U.so(o.whatsapp), prefixo: U.normCodigo(o.prefixo || "") } }),
    async importarInfluencers(pin, linhas) {
      const d = await this.dados(pin, null, null);
      const res = { criadas: [], erros: [] };
      for (const [i, l] of linhas.entries()) {
        const ac = U.acharLoja(d.lojas, l.loja, l.bandeira);
        const sab = d.sabados.find((x) => String(x.n) === String(l.sabado || 1));
        if (!ac.loja) { res.erros.push(`Linha ${i + 1}: ${ac.erro}.`); continue; }
        const loja = ac.loja;
        const prefixos = d.influencers.map((x) => x.prefixo).concat(res.criadas);
        try {
          const inf = await this.salvarInfluencer(pin, { nome: l.nome, instagram: l.instagram, whatsapp: "", prefixo: U.gerarPrefixo(l.nome, prefixos), loja_id: loja.id, sabado_id: sab ? sab.id : d.sabados[0].id, lote: l.lote || 100, meta: l.meta || (sab ? sab.meta : 50), ativo: true });
          res.criadas.push(inf.prefixo);
        } catch (e) { res.erros.push(`Linha ${i + 1}: ${e.message}`); }
      }
      return res;
    },
    salvarLoja: (pin, o) => rpc("adm_salvar_loja", { p_pin: String(pin), p: o }),
    salvarSabado: (pin, o) => rpc("adm_salvar_sabado", { p_pin: String(pin), p: o }),
    cadastros: (pin, f) => rpc("adm_cadastros", { p_pin: String(pin), p_busca: f.busca || "", p_sabado: +f.sabado_id || null, p_influencer: +f.influencer_id || null, p_status: f.status || "", p_loja: +f.loja_id || null, p_bandeira: f.bandeira || null }, { tentativas: 1 }),
    importarNotas: (pin, linhas) => blocos("adm_importar_notas", pin, linhas.map((l) => ({ cpf: U.so(l.cpf), chave: (U.lerNFCe(l.chave) || {}).chave || "", data: U.dataISO(l.data), valor: dinheiro(l.valor) })), 4000, () => ({}), ["usados", "ja_usados", "sem_cupom", "recusadas"]),
    importarVendas: (pin, linhas) => blocos("adm_importar_vendas", pin, linhas.map((l) => ({ cupom: U.normCodigo(l.cupom), cpf: U.so(l.cpf), nota: String(l.nota || ""), data: U.dataISO(l.data), valor: dinheiro(l.valor) })), 4000, () => ({}), ["usados", "ja_usados", "sem_cupom", "recusadas"]),
    baseCpfs: async (pin, cpfs, substituir) => {
      const t = { lidos: 0, total: 0 };
      for (let i = 0; i < Math.max(1, cpfs.length); i += 50000) {
        const r = await rpc("adm_base_cpfs", { p_pin: String(pin), p_cpfs: cpfs.slice(i, i + 50000), p_substituir: i === 0 ? !!substituir : false }, { limite: 120000 });
        t.lidos += r.lidos; t.total = r.total;
      }
      return t;
    },
    importarFimDeAno: (pin, linhas, substituir, band) => blocos("adm_importar_fimdeano", pin,
      linhas.map((l) => ({ cpf: U.so(l.cpf), nome: l.nome || "", nota: String(l.nota || "").trim(), data: U.dataISO(l.data), valor: dinheiro(l.valor), loja: l.loja || "" })),
      4000, (primeiro) => ({ p_substituir: primeiro, p_bandeira: band }), ["importadas", "repetidas", "recusadas"], substituir),
    // lista de tokens é pequena (até alguns milhares): vai de uma vez para o "substituir" valer por influencer
    importarTokens: (pin, linhas, substituir, sabado) => rpc("adm_importar_tokens", { p_pin: String(pin), p_substituir: !!substituir, p_sabado: +sabado || null, p: linhas }, { limite: 120000 }),
    tokens: (pin, sabado) => rpc("adm_tokens", { p_pin: String(pin), p_sabado: +sabado || null }, { tentativas: 1 }),
    comparativo: (pin, sid, band, todos) => rpc("adm_comparativo", { p_pin: String(pin), p_sabado: +sid || null, p_bandeira: band || null, p_todos: !!todos }, { tentativas: 1, limite: 120000 }),
    definirTeste: (pin, teste) => rpc("adm_teste", { p_pin: String(pin), p_teste: !!teste }),
    // chaves da API de relatórios (a chave completa só volta na criação)
    chavesApi: (pin) => rpc("adm_chaves_api", { p_pin: String(pin) }, { tentativas: 1 }),
    criarChaveApi: (pin, o) => rpc("adm_criar_chave_api", { p_pin: String(pin), p_nome: o.nome, p_escopo: o.escopo, p_influencer: +o.influencer || null, p_bandeira: o.bandeira || null, p_expira_em: o.expira_em || null }),
    revogarChaveApi: (pin, id) => rpc("adm_revogar_chave_api", { p_pin: String(pin), p_id: +id }),
  };
})();

<script>

  const ETAPAS = [["convidada", "Convidada"], ["contrato", "Contrato assinado"], ["kit", "Kit entregue"], ["gravacao", "Vídeos enviados"], ["aprovada", "Aprovada"], ["no_ar", "No ar"]];
  const nomeEtapa = (k) => (ETAPAS.find((e) => e[0] === k) || ["", "Convidada"])[1];

  // ---------- sessão (PIN) ----------
  const mem = {};
  const sess = {
    get: (k) => { try { return sessionStorage.getItem("sp-" + k) || mem[k] || ""; } catch (e) { return mem[k] || ""; } },
    set: (k, v) => { mem[k] = v; try { v ? sessionStorage.setItem("sp-" + k, v) : sessionStorage.removeItem("sp-" + k); } catch (e) { /* memória */ } },
  };

  // ---------- rotas ----------
  // hash (artefato): #lp-ana, #balcao, #visao, #influencers, #inf-ana, #links, #clientes, #lojas, #sabados, #base, #config
  // path (hospedado): /ana, /balcao, /crm, /crm/influencers, /crm/inf/ana …
  const SECOES = ["visao", "comparativo", "influencers", "links", "clientes", "lojas", "sabados", "base", "integracoes", "chaves", "config"];
  function rota() {
    if (C.ROTAS === "path") {
      const p = decodeURIComponent(location.pathname.replace(/^\/+|\/+$/g, "")).toLowerCase().split("/");
      if (!p[0]) return { v: "visao" };
      if (p[0] === "balcao") return { v: "balcao" };
      if (p[0] === "crm") { if (p[1] === "inf" && p[2]) return { v: "inf", slug: p[2] }; if (p[1] === "loja" && p[2]) return { v: "loja", slug: p[2] }; return { v: SECOES.includes(p[1]) ? p[1] : "visao" }; }
      return { v: "lp", slug: p[0] };
    }
    const h = decodeURIComponent(location.hash.slice(1)).toLowerCase();
    if (h.startsWith("lp-")) return { v: "lp", slug: h.slice(3) };

  function link(v, slug) {

    if (v === "inf") return `#inf-${slug}`;

  }
  const linkPublico = (slug) => (C.BASE_URL ? C.BASE_URL.replace(/\/$/, "") + (C.ROTAS === "path" ? `/${slug}` : `/#lp-${slug}`) : link("lp", slug));

  function ir(v, slug) {

  window.addEventListener("hashchange", render);

  // ---------- utilidades de tela ----------

    }
  }
  async function salvarArquivo(nome, blob) {
    try {
      const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;

    } catch (e) { /* segue para o link */ }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  function qr(el, texto, tam = 150) {
    el.innerHTML = "";
    if (window.QRCode) new QRCode(el, { text: texto, width: tam, height: tam, colorDark: "#001D7E", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
    else el.innerHTML = `<div style="width:${tam}px;height:${tam}px;display:grid;place-items:center;font-size:12px;color:#59618A">QR indisponível</div>`;

    document.body.appendChild(f);

  // lê um arquivo de texto: UTF-8 e, se não for, Windows-1252 (CSV do Excel em português); tira o BOM

      app.innerHTML = `<div class="lp"><div class="wrap lp-topo"></div><div class="wrap lp-hero"><h1>Página não encontrada</h1><p>Confira o link que a influencer postou.</p></div></div>`;
      return;
    }
    const pn = U.primeiroNome(d.influencer.nome);
    const bd = (d.loja && d.loja.bandeira) || "tesoura", BX = bInfo(bd);
    document.title = `${C.CAMPANHA} com ${pn}`;
    // cupom já pego neste aparelho: só vale para o sábado atual da influencer (no sábado seguinte a cliente pega outro)
    const salvo = (() => {
      try {
        const x = JSON.parse(localStorage.getItem("sp-cupom-" + slug) || "null");
        if (x && x.data && d.sabado && String(x.data).slice(0, 10) !== String(d.sabado.data).slice(0, 10)) { localStorage.removeItem("sp-cupom-" + slug); return null; }
        return x;
      } catch (e) { return null; }
    })();
    // cadastro que não chegou ao servidor (queda de rede ou do servidor): fica guardado e é reenviado sozinho
    const PK = "sp-pend-" + slug;
    const lerPend = () => { try { const x = JSON.parse(localStorage.getItem(PK) || "null"); return x && Date.now() - x.ts < 6 * 3600 * 1000 ? x : null; } catch (e) { return null; } };
    const guardarPend = (dd) => { try { localStorage.setItem(PK, JSON.stringify({ ...dd, ts: Date.now() })); } catch (e) { /* sem armazenamento */ } };
    const limparPend = () => { try { localStorage.removeItem(PK); } catch (e) { /* ok */ } };
    const foto = d.influencer.foto ? `<img class="lp-foto" src="${esc(d.influencer.foto)}" alt="${esc(pn)}">` : `<div class="lp-foto" aria-hidden="true">${esc(pn[0] || "")}</div>`;
    app.innerHTML = `${faixaDemo()}<div class="lp" data-b="${bd}" style="${coresLP(bd)}">
      <div class="wrap lp-topo">${marca(bd, false)}</div>
      <section class="wrap lp-hero">
        ${foto}
        <span class="lp-eb">${esc(C.CAMPANHA)}</span>
        <h1>Vem comigo na <b>${esc(BX.NOME)}</b></h1>
        <p>Pega o seu cupom aqui e usa no caixa da loja no sábado: o vale entra na hora. Quem convida é a <b style="color:#fff">${esc(pn)}</b>${d.influencer.instagram ? ` (${esc(d.influencer.instagram)})` : ""}.</p>
        <div class="lp-data"><span>Sábado ${U.dataBR(d.sabado.data)}</span><span>${esc(d.loja.nome)}</span>${d.loja.horario ? `<span>${esc(d.loja.horario)}</span>` : ""}</div>
      </section>
      <section class="lp-card" id="lp-corpo"></section>
      <p class="lp-fim">${esc(C.REGRAS)}</p>
      ${termosFimDeAno(bd)}
    </div>`;
    const corpo = document.getElementById("lp-corpo");
    if (salvo && salvo.codigo) return mostrarCupom(corpo, { ...salvo, bandeira: salvo.bandeira || bd }, slug);
    if (d.liberado === false && !lerPend()) {
      corpo.innerHTML = `<h2>Os cupons da ${esc(pn)} ainda não foram liberados</h2><p class="muted" style="margin:0">Volte em breve: assim que o lote for liberado, o cadastro abre aqui. Fica de olho no perfil dela.</p>`;
      return;
    }
    if (d.disponiveis <= 0 && !lerPend()) {
      corpo.innerHTML = `<h2>Os cupons da ${esc(pn)} acabaram</h2><p class="muted" style="margin:0">Todos os cupons deste sábado já foram pegos. Fica de olho no perfil dela: pode ter mais no próximo.</p>`;
      return;
    }
    corpo.innerHTML = `
      <h2>Pegue o seu cupom</h2>
      <ol class="lp-passos"><li>Cadastre-se aqui e receba o seu cupom.</li><li>No sábado ${U.dataBR(d.sabado.data)}, compre na ${esc(d.loja.nome)}.</li><li>Na hora de pagar, mostre o cupom e informe o seu CPF. O vale entra na compra.</li></ol>
      <form id="f-cad" novalidate style="display:grid;gap:12px">
        <div class="campo"><label for="c-nome">Nome completo</label><input id="c-nome" name="nome" autocomplete="name" required></div>
        <div class="campo"><label for="c-cpf">CPF</label><input id="c-cpf" name="cpf" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" required><span class="dica">O cupom fica ligado ao seu CPF. Só você consegue usar.</span></div>
        <div class="campo"><label for="c-wpp">WhatsApp</label><input id="c-wpp" name="whatsapp" inputmode="tel" autocomplete="tel" placeholder="(61) 90000-0000" required></div>
        <div class="campo"><label for="c-bairro">Bairro <span style="font-weight:400">(opcional)</span></label><input id="c-bairro" name="bairro" autocomplete="address-level3"></div>
        <label class="check" for="c-aceite"><input type="checkbox" id="c-aceite" name="aceite"><span>${esc(String(C.LGPD).replace(/\{MARCA\}/g, BX.NOME))}</span></label>
        <div id="cad-msg"></div>
        <button class="btn ouro" type="submit" style="padding:14px;font-size:16px">Quero o meu cupom</button>
        <p class="lp-regras">${d.disponiveis <= 20 ? `<b style="color:#A86400">Restam só ${d.disponiveis} cupons.</b> ` : ""}Um cupom por CPF.</p>
      </form>`;
    const f = document.getElementById("f-cad");
    f.cpf.addEventListener("input", () => (f.cpf.value = U.fmtCPF(f.cpf.value)));
    f.whatsapp.addEventListener("input", () => (f.whatsapp.value = U.fmtTel(f.whatsapp.value)));
    const msg = document.getElementById("cad-msg");
    const btn = f.querySelector("button[type=submit]");
    let enviando = false, rodadas = 0;
    const concluir = (r, nome) => {
      const dados = { codigo: r.codigo, ja_existia: r.ja_existia, outra: r.outra_influencer, loja: r.loja.nome, endereco: r.loja.endereco, horario: r.loja.horario, data: r.sabado.data, nome: U.primeiroNome(nome), bandeira: (r.loja && r.loja.bandeira) || bd };
      try { localStorage.setItem("sp-cupom-" + slug, JSON.stringify(dados)); } catch (err) { /* sem armazenamento */ }
      limparPend();
      mostrarCupom(corpo, dados, slug);
      corpo.scrollIntoView({ behavior: "smooth", block: "start" });
    };
    async function enviar(dd) {
      if (enviando) return;
      enviando = true; btn.disabled = true; btn.textContent = "Gerando o seu cupom…";
      try {
        const r = await A.cadastrar({ slug, ...dd });
        concluir(r, dd.nome);
      } catch (err) {
        if (err.temporario) {
          // o servidor não respondeu: os dados ficam guardados neste aparelho e a página tenta de novo sozinha
          guardarPend(dd);
          msg.innerHTML = `<div class="aviso alerta">Estamos com instabilidade para confirmar o seu cupom. Os seus dados estão guardados neste aparelho e vamos tentar de novo sozinhos. Não feche esta página.</div>`;
          btn.textContent = "Tentando de novo…";
          rodadas++;
          if (rodadas <= 60) setTimeout(() => { enviando = false; if (document.getElementById("f-cad") === f) enviar(dd); }, 6000);
          else { btn.disabled = false; btn.textContent = "Tentar de novo"; }
        } else {
          limparPend();
          msg.innerHTML = `<div class="aviso erro">${esc(err.message)}</div>`;
          btn.disabled = false; btn.textContent = "Quero o meu cupom";
        }
      } finally { enviando = false; }
    }
    f.addEventListener("submit", (e) => {
      e.preventDefault();
      rodadas = 0;
      enviar({ nome: f.nome.value, cpf: f.cpf.value, whatsapp: f.whatsapp.value, bairro: f.bairro.value, aceite: f.aceite.checked });
    });
    // voltou à página com um cadastro que ficou pendente: reenvia sozinho
    const pend = lerPend();
    if (pend) {
      f.nome.value = pend.nome || ""; f.cpf.value = U.fmtCPF(pend.cpf || ""); f.whatsapp.value = U.fmtTel(pend.whatsapp || ""); f.bairro.value = pend.bairro || ""; f.aceite.checked = !!pend.aceite;
      msg.innerHTML = `<div class="aviso alerta">Retomando o seu cadastro que não tinha chegado ao servidor…</div>`;
      enviar({ nome: pend.nome, cpf: pend.cpf, whatsapp: pend.whatsapp, bairro: pend.bairro, aceite: pend.aceite });
    }
  }

  // termos da campanha de fim de ano no rodapé da página (texto em config.js), com link para o regulamento
  function termosFimDeAno(b) {
    const F = bInfo(b);
    if (!F || !F.TERMOS) return "";
    const t = esc(F.TERMOS).replace(/www\.sonhonovo\.tesouradeouro\.com\.br/g, `<a href="${esc(F.SITE)}" target="_blank" rel="noopener">www.sonhonovo.tesouradeouro.com.br</a>`)
      .replace(/www\.tesouradeouro\.com\.br/g, `<a href="https://www.tesouradeouro.com.br" target="_blank" rel="noopener">www.tesouradeouro.com.br</a>`);
    return `<p class="lp-termos">${t}</p>`;
  }

  function passo4(b) {
    const F = bInfo(b);
    if (!F.SITE && !F.WHATSAPP) return "";
    const onde = [F.SITE ? `em <a href="${esc(F.SITE)}" target="_blank" rel="noopener">${esc(F.SITE_TEXTO || F.SITE)}</a>` : "", F.WHATSAPP ? `no WhatsApp ${esc(F.WHATSAPP)}` : ""].filter(Boolean).join(" ou ");
    return `<li><span>Depois, cadastre o cupom fiscal no sorteio ${esc(F.CAMPANHA || "de fim de ano")} ${onde}${F.PREMIO ? ` e concorra a ${esc(F.PREMIO)}` : ""}.</span></li>`;
  }

  function mostrarCupom(corpo, c, slug) {
    const aviso = c.outra ? `<div class="aviso alerta">Este CPF já tinha um cupom pelo convite da ${esc(U.primeiroNome(c.outra))}. Vale o cupom abaixo.</div>` : c.ja_existia ? `<div class="aviso ok">Você já tinha se cadastrado. Este é o seu cupom.</div>` : "";
    corpo.innerHTML = `
      <h2>${c.nome ? esc(c.nome) + ", " : ""}seu cupom está garantido!</h2>${aviso}
      <div class="cupom" id="cupom-cartao">
        <small>Seu cupom</small>
        <div class="cod" id="cupom-cod">${esc(c.codigo)}</div>
        <div class="qr" id="cupom-qr"></div>
        <div class="info">Sábado <b>${U.dataBR(c.data)}</b> · <b>${esc(c.loja)}</b>${c.horario ? `<br>${esc(c.horario)}` : ""}${c.endereco ? `<br>${esc(c.endereco)}` : ""}</div>
      </div>
      <div class="acoes"><button class="btn" id="b-copiar" type="button">Copiar cupom</button><button class="btn sec" id="b-salvar" type="button">Salvar imagem</button></div>
      <ol class="lp-passos"><li>Tire um print desta tela ou salve a imagem.</li><li>No sábado, escolha as suas peças na loja.</li><li>No caixa, mostre este cupom e informe o seu CPF. O vale entra na hora.</li>${passo4(c.bandeira)}</ol>
      <p class="lp-regras">${esc(C.REGRAS)}</p>
      <button class="btn sec peq" id="b-outro" type="button" style="justify-self:center">Cadastrar outro CPF</button>`;
    qr(document.getElementById("cupom-qr"), c.codigo, 150);
    document.getElementById("b-copiar").onclick = () => copiar(c.codigo, document.getElementById("cupom-cod"));
    document.getElementById("b-salvar").onclick = () => salvarImagemCupom(c);
    document.getElementById("b-outro").onclick = () => { try { localStorage.removeItem("sp-cupom-" + slug); } catch (e) { /* ok */ } vLP(slug); };
  }

  function salvarImagemCupom(c) {
    const W = 720, H = 1000, cv = document.createElement("canvas"); cv.width = W; cv.height = H;
    const g = cv.getContext("2d");
    const X = bInfo(c.bandeira || "tesoura");
    g.fillStyle = X.COR || "#001D7E"; g.fillRect(0, 0, W, H);
    const logo = new Image();
    const desenhar = () => {
      if (logo.width) { const lw = 260, lh = (logo.height * lw) / logo.width; g.drawImage(logo, (W - lw) / 2, 60, lw, Math.min(lh, 110)); }
      else { g.fillStyle = "#FFFFFF"; g.font = "700 46px Raleway, Arial"; g.textAlign = "center"; g.fillText(X.NOME, W / 2, 130); }
      g.textAlign = "center";
      g.fillStyle = X.DESTAQUE || "#BF9556"; g.font = "700 26px Roboto, Arial"; g.textAlign = "center"; g.fillText(C.CAMPANHA.toUpperCase(), W / 2, 200);
      g.fillStyle = "#FFFBF5"; roundRect(g, 60, 240, W - 120, 640, 28); g.fill();
      g.setLineDash([12, 10]); g.strokeStyle = X.DESTAQUE || "#BF9556"; g.lineWidth = 4; roundRect(g, 76, 256, W - 152, 608, 22); g.stroke(); g.setLineDash([]);
      g.fillStyle = X.DESTAQUE_ESC || "#9C7438"; g.font = "700 24px Roboto, Arial"; g.fillText("SEU CUPOM", W / 2, 320);
      g.fillStyle = X.COR || "#001D7E"; g.font = "700 84px 'Roboto Mono', Menlo, monospace"; g.fillText(c.codigo, W / 2, 415);
      const q = qrCanvas(document.getElementById("cupom-qr")); if (q) g.drawImage(q, (W - 260) / 2, 450, 260, 260);
      g.fillStyle = "#0D1540"; g.font = "600 28px Roboto, Arial"; g.fillText(`Sábado ${U.dataBR(c.data)}`, W / 2, 760);
      g.fillStyle = "#59618A"; g.font = "400 24px Roboto, Arial"; g.fillText(c.loja, W / 2, 800); if (c.horario) g.fillText(c.horario, W / 2, 836);
      g.fillStyle = "rgba(255,255,255,.85)"; g.font = "400 21px Roboto, Arial";
      quebra(g, "No caixa, mostre este cupom e informe o seu CPF. O vale entra na hora.", W / 2, 930, W - 120, 28);
      cv.toBlob((b) => salvarArquivo(`cupom-${c.codigo}.png`, b), "image/png");
    };
    logo.onload = desenhar; logo.onerror = desenhar;
    if (L[X.LOGO]) logo.src = L[X.LOGO]; else desenhar();
  }
  function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
  function quebra(g, txt, x, y, max, alt) { const p = txt.split(" "); let l = "", ys = y; for (const w of p) { if (g.measureText(l + w).width > max) { g.fillText(l.trim(), x, ys); l = ""; ys += alt; } l += w + " "; } g.fillText(l.trim(), x, ys); }

  // =====================================================================
  // BALCÃO DA LOJA (tela própria, sem o CRM)
  // =====================================================================
  const FILA = "sp-fila-validacoes";
  const lerFila = () => { try { return JSON.parse(localStorage.getItem(FILA) || "[]"); } catch (e) { return []; } };
  const gravarFila = (f) => { try { localStorage.setItem(FILA, JSON.stringify(f)); } catch (e) { /* ok */ } };
  async function enviarFila() {
    const f = lerFila(); if (!f.length) return;
    const resto = [];
    for (const it of f) { try { await A.balcaoValidar(it.pin, it.codigo, it.fiscal, it.valor); } catch (e) { resto.push(e.rede ? it : { ...it, erro: e.message }); } }
    const recusadas = resto.filter((x) => x.erro);
    gravarFila(resto.filter((x) => !x.erro));
    if (recusadas.length) toast(`${recusadas.length} validação(ões) recusadas: ${recusadas.map((x) => x.codigo + " (" + x.erro + ")").join(", ")}`);
    else if (resto.length < f.length) toast(`${f.length - resto.length} validação(ões) enviadas`);
  }
  window.addEventListener("online", enviarFila);

  const barraBalcao = (extra) => `${faixaDemo()}<header class="barra"><div class="wrap"><img class="tes" src="${L.tesouraBranco || ""}" alt="Tesoura de Ouro"><span class="nome">${esc(C.CAMPANHA)} · Consulta do cupom</span>${extra || ""}</div></header>`;

  function loginBalcao() {
    app.innerHTML = `${barraBalcao()}<main class="wrap"><form class="login painel" id="f-login">

      <p class="muted" style="margin:0">Digite o PIN da sua loja para conferir os cupons.</p>

      <div id="login-msg"></div><button class="btn" type="submit">Entrar</button>
      ${A.modo === "demo" ? `<p class="muted" style="font-size:13px">Demonstração: PIN da loja Ceilândia Centro <b>${A.pinDemo.loja}</b></p>` : ""}
    </form></main>`;
    const f = document.getElementById("f-login"); f.pin.focus();
    f.addEventListener("submit", async (e) => {
      e.preventDefault();
      try { const r = await A.balcaoEntrar(f.pin.value.trim()); sess.set("loja", f.pin.value.trim()); sess.set("loja-nome", r.loja.nome); vBalcao(); }
      catch (err) { document.getElementById("login-msg").innerHTML = `<div class="aviso erro">${esc(err.message)}</div>`; }

  async function vBalcao() {
    document.title = `${C.CAMPANHA} · Balcão`;
    const pin = sess.get("loja");
    if (!pin) return loginBalcao();
    enviarFila();
    app.innerHTML = `${barraBalcao(`<button class="btn sec peq" id="b-sair" type="button">Trocar loja</button>`)}<main class="wrap pagina"><div class="balcao grade">
      <div class="cab"><div><h1>${esc(sess.get("loja-nome"))}</h1><p>Confira o cupom ou o CPF da cliente antes de digitar o código no PDV.</p></div></div>
      <form class="busca" id="f-busca"><input id="termo" placeholder="ANA014 ou CPF" autocomplete="off" autocapitalize="characters" aria-label="Cupom ou CPF"><button class="btn" type="submit">Buscar</button></form>
      <div id="b-camera"></div>
      <div id="res"></div>

    async function historico() {

        (h.length ? h.map((c) => `<div><span><code>${esc(c.codigo)}</code> · ${esc(c.nome)} · ${esc(U.primeiroNome(c.influencer))}</span><span class="muted num">${U.horaBR(c.usado_em)}</span></div>`).join("") : fila.length ? "" : `<span class="muted">Nenhuma ainda.</span>`);
    }
    historico();
    async function buscar() {
      const termo = f.termo.value.trim(); if (!termo) return;
      res.innerHTML = `<p class="muted">Buscando…</p>`;
      try {
        const r = await A.balcaoBuscar(pin, termo);
        const c = r.cupom;
        res.innerHTML = `<div class="resultado ${r.valido ? "valido" : "invalido"}">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span class="grande">${esc(c.codigo)}</span>${r.valido ? `<span class="pill ok">Válido</span>` : `<span class="pill erro">Não pode usar</span>`}</div>
          ${r.aviso_teste ? `<div class="aviso alerta">${esc(r.aviso_teste)}</div>` : ""}
          ${r.motivos.length ? `<div class="aviso erro">${r.motivos.map(esc).join("<br>")}</div>` : ""}
          <dl class="dl"><dt>Cliente</dt><dd>${esc(c.nome)}</dd><dt>CPF</dt><dd class="num">${esc(c.cpf_mascara)}</dd><dt>Influencer</dt><dd>${esc(c.influencer)}</dd><dt>Loja</dt><dd>${esc(c.loja_nome)}</dd><dt>Sábado</dt><dd>${U.dataBR(c.sabado_data)}</dd>
          ${c.status === "usado" ? `<dt>Cupom fiscal</dt><dd>${esc(c.cupom_fiscal || "")}</dd>` : ""}</dl>
          ${r.valido ? `<form id="f-val" style="display:grid;gap:10px">
            <div class="campo"><label for="v-fiscal">Cupom fiscal</label><input id="v-fiscal" autocomplete="off" placeholder="Leia o QR da nota ou digite o número" required><span class="dica" id="v-nota">Com o QR da nota, o sistema confere a loja e o mês e impede usar a mesma nota duas vezes.</span></div>
            ${"BarcodeDetector" in window && navigator.mediaDevices ? `<button class="btn sec" type="button" id="v-ler">Ler QR do cupom fiscal</button>` : ""}
            <div class="campo"><label for="v-valor">Valor da compra (R$)</label><input id="v-valor" inputmode="decimal" placeholder="0,00"></div>
            <div id="v-msg"></div>
            <button class="btn ouro" type="submit" style="padding:14px">Confirmar e entregar o vale</button></form>` : ""}

        const fv = document.getElementById("f-val");
        if (fv) {

          vf.focus();
          fv.addEventListener("submit", async (e) => {
            e.preventDefault();
            const fiscal = fv.querySelector("#v-fiscal").value.trim(), valor = fv.querySelector("#v-valor").value.trim();
            if (!fiscal) { fv.querySelector("#v-msg").innerHTML = `<div class="aviso erro">Leia o QR do cupom fiscal ou digite o número da nota.</div>`; return; }
            const bt = fv.querySelector("button"); bt.disabled = true;
            try {

  async function lerQR(aoLer) {
    let stream;
    const m = modal(`<h2>Aponte a câmera para o QR</h2><video id="cam" playsinline muted style="width:100%;border-radius:10px;background:#000"></video><div class="rodape"><button class="btn sec" data-fechar type="button">Fechar</button></div>`);
    const parar = () => { if (stream) stream.getTracks().forEach((t) => t.stop()); };
    m.addEventListener("click", (e) => { if (e.target === m || e.target.closest("[data-fechar]")) parar(); });
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      const v = m.querySelector("#cam"); v.srcObject = stream; await v.play();
      const det = new BarcodeDetector({ formats: ["qr_code"] });
      const loop = async () => {
        if (!document.body.contains(m)) return parar();
        try { const cods = await det.detect(v); if (cods.length) { parar(); m.remove(); return aoLer(cods[0].rawValue); } } catch (e) { /* tenta de novo */ }
        requestAnimationFrame(loop);
      };
      loop();
    } catch (e) { m.querySelector(".modal").insertAdjacentHTML("beforeend", `<div class="aviso erro">Não foi possível abrir a câmera. Digite o cupom.</div>`); }
  }

  function grafico(serie) {
    if (!serie.length) return `<p class="muted">Sem cupons ainda.</p>`;
    const W = 900, H = 220, pe = 34, pb = 26, pt = 10;
    const max = Math.max(...serie.map((d) => Math.max(d.emitidos, d.usados)), 1);
    const passo = Math.pow(10, Math.floor(Math.log10(max))), topo = Math.ceil(max / passo) * passo;
    const bw = (W - pe) / serie.length, y = (v) => pt + (H - pt - pb) * (1 - v / topo);
    let g = "";
    for (let k = 0; k <= 4; k++) { const v = (topo / 4) * k; g += `<line x1="${pe}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#E6E9F3"/><text x="${pe - 6}" y="${y(v) + 4}" text-anchor="end">${Math.round(v)}</text>`; }
    serie.forEach((d, i) => {
      const x = pe + i * bw, w = Math.min(22, bw / 3);
      g += `<rect x="${x + bw / 2 - w - 1}" y="${y(d.emitidos)}" width="${w}" height="${H - pb - y(d.emitidos)}" fill="#BF9556" rx="2"><title>${U.dataBR(d.dia)}: ${d.emitidos} distribuídos</title></rect>`;
      g += `<rect x="${x + bw / 2 + 1}" y="${y(d.usados)}" width="${w}" height="${H - pb - y(d.usados)}" fill="#001D7E" rx="2"><title>${U.dataBR(d.dia)}: ${d.usados} usados</title></rect>`;
      g += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${U.dataBR(d.dia)}</text>`;
    });
    return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cupons distribuídos e usados por dia" style="min-width:560px">${g}</svg></div>`;
  }

  // lê a imagem enviada, recorta o centro em quadrado e reduz para 480 px (JPEG), para guardar junto da influencer
  function fotoQuadrada(arquivo, lado = 480) {
    return new Promise((ok, falha) => {
      if (!/^image\//.test(arquivo.type)) return falha(new Error("Envie uma imagem em JPG, PNG ou WebP."));
      if (arquivo.size > 15 * 1024 * 1024) return falha(new Error("A imagem passa de 15 MB. Envie uma menor."));
      const url = URL.createObjectURL(arquivo), img = new Image();
      img.onload = () => {
        const q = Math.min(img.naturalWidth, img.naturalHeight), cv = document.createElement("canvas");
        cv.width = cv.height = Math.min(lado, q);
        cv.getContext("2d").drawImage(img, (img.naturalWidth - q) / 2, (img.naturalHeight - q) / 2, q, q, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        ok(cv.toDataURL("image/jpeg", 0.85));
      };
      img.onerror = () => { URL.revokeObjectURL(url); falha(new Error("Não consegui abrir essa imagem. Tente salvar como JPG e enviar de novo.")); };
      img.src = url;
    });
  }

    modal(`<h2>Importar influencers</h2>
      <p class="muted" style="margin:0">Uma por linha, separando por ponto e vírgula: <b>nome; instagram; loja; sábado (1, 2 ou 3); lote; meta; bandeira</b> (tesoura, magazine ou free). A loja pode ser parte do nome, mas se mais de uma loja servir a linha é recusada: use o nome completo ou a bandeira. Dá para colar direto da planilha.</p>

        <td class="num">${U.horaBR(c.criado_em)}</td><td>${c.status === "usado" ? `<span class="pill ok">Usado</span><span class="sub num">${U.horaBR(c.usado_em)}${c.origem === "rock" ? " · via Rock" : c.origem === "pdv" ? " · PDV" : c.origem === "balcao" ? " · consulta" : ""}</span>` : `<span class="pill neutro">Emitido</span>`}</td>
        <td class="n">${c.valor ? U.brl2(c.valor) : ""}</td><td>${c.status !== "usado" ? "" : c.cliente_novo === null ? `<span class="pill neutro">a cruzar</span>` : c.cliente_novo ? `<span class="pill ouro">Novo</span>` : `<span class="pill neutro">Já cliente</span>`}</td></tr>`).join("") || `<tr><td colspan="7" class="muted">Nenhum cupom.</td></tr>`}

  function formLoja(l) {
    {
      l = l || { nome: bInfo(band || "tesoura").NOME + " ", cidade: "", endereco: "", horario: "9h às 18h", pin: "", cnpj: "", bandeira: band || "tesoura" };
      const aqui = D.influencers.filter((i) => l.id && i.loja_id === l.id);
      // primeiro as desta loja, depois as sem loja de destaque, em ordem alfabética
      const listaOrd = [...D.influencers].sort((a, b) => (b.loja_id === l.id) - (a.loja_id === l.id) || a.nome.localeCompare(b.nome));
      modal(`<h2>${l.id ? "Editar loja" : "Nova loja"}</h2><form id="f-loja" class="grade">
        <div class="grade g2"><div class="campo"><label for="l-band">Bandeira</label><select id="l-band">${BKEYS.map((k) => `<option value="${k}" ${k === (l.bandeira || "tesoura") ? "selected" : ""}>${esc(bInfo(k).NOME)}</option>`).join("")}</select></div>
        <div class="campo"><label for="l-nome">Nome</label><input id="l-nome" value="${esc(l.nome)}"></div></div>
        <div class="grade g2"><div class="campo"><label for="l-cid">Cidade ou bairro</label><input id="l-cid" value="${esc(l.cidade)}"></div><div class="campo"><label for="l-hor">Horário no sábado</label><input id="l-hor" value="${esc(l.horario)}"></div></div>
        <div class="campo"><label for="l-end">Endereço</label><input id="l-end" value="${esc(l.endereco)}"></div>
        <div class="grade g2"><div class="campo"><label for="l-pin">PIN do balcão (4 a 6 números)</label><input id="l-pin" value="${esc(l.pin)}" inputmode="numeric"></div>
        <div class="campo"><label for="l-cnpj">CNPJ da loja</label><input id="l-cnpj" value="${esc(U.fmtCNPJ(l.cnpj || ""))}" inputmode="numeric"><span class="dica">Confere se a nota fiscal é desta loja.</span></div></div>
        <div class="campo"><label for="l-inf-busca">Influencers desta loja</label>
          <div class="sel-inf" id="l-inf-sel">${aqui.length ? aqui.map((i) => `<span class="pill ok">${esc(i.nome)}</span>`).join("") : `<span class="muted" style="font-size:13px">Nenhuma selecionada</span>`}</div>
          <input id="l-inf-busca" placeholder="Buscar influencer pelo nome" autocomplete="off">
          <div class="lista-inf" id="l-inf-lista">${listaOrd.map((i) => { const outra = i.loja_id && i.loja_id !== l.id; return `<label class="check" data-nome="${esc(U.semAcento(i.nome).toLowerCase())}"><input type="checkbox" value="${i.id}" ${i.loja_id === l.id ? "checked disabled" : ""}><span><b style="color:var(--tinta)">${esc(i.nome)}</b> · ${esc(i.prefixo)}${outra ? ` · hoje em ${esc(nomeLoja(i.loja_id))}` : ""}${i.loja_id === l.id ? " · já está nesta loja" : ""}</span></label>`; }).join("") || `<span class="muted">Nenhuma influencer cadastrada.</span>`}</div>
          <span class="dica">Marque quem vai atender esta loja. Quem estava em outra loja muda para esta. Para tirar uma influencer daqui, marque ela em outra loja ou troque na ficha dela.</span>
          <div id="l-inf-aviso"></div></div>
        <div id="l-msg"></div><div class="rodape"><button class="btn sec" data-fechar type="button">Cancelar</button><button class="btn" type="submit">Salvar</button></div></form>`, (m, fechar) => {
        const marcadas = () => [...m.querySelectorAll("#l-inf-lista input:checked:not(:disabled)")].map((c) => D.influencers.find((i) => i.id === +c.value));
        m.querySelector("#l-inf-busca").oninput = (e) => { const b = U.semAcento(e.target.value).toLowerCase(); m.querySelectorAll("#l-inf-lista label").forEach((x) => (x.hidden = b && !x.dataset.nome.includes(b))); };
        m.querySelector("#l-inf-lista").addEventListener("change", () => {
          const sel = aqui.concat(marcadas());
          m.querySelector("#l-inf-sel").innerHTML = sel.map((i) => `<span class="pill ok">${esc(i.nome)}</span>`).join("") || `<span class="muted" style="font-size:13px">Nenhuma selecionada</span>`;
          const mudam = marcadas().filter((i) => i.loja_id && i.loja_id !== l.id);
          m.querySelector("#l-inf-aviso").innerHTML = mudam.length ? `<div class="aviso alerta">${mudam.map((i) => `${esc(U.primeiroNome(i.nome))} sai da ${esc(nomeLoja(i.loja_id))}${i.emitidos ? ` (os ${U.n(i.emitidos)} cupons já emitidos continuam valendo lá)` : ""}`).join("<br>")}.</div>` : "";
        });
        m.querySelector("form").addEventListener("submit", async (e) => {
          e.preventDefault();
          const btn = m.querySelector("button[type=submit]"); btn.disabled = true;
          try {
            const loja = await A.salvarLoja(sess.get("adm"), { id: l.id, nome: m.querySelector("#l-nome").value, cidade: m.querySelector("#l-cid").value, horario: m.querySelector("#l-hor").value, endereco: m.querySelector("#l-end").value, pin: m.querySelector("#l-pin").value, cnpj: m.querySelector("#l-cnpj").value, bandeira: m.querySelector("#l-band").value });
            const novas = marcadas();
            for (const i of novas) await A.salvarInfluencer(sess.get("adm"), { id: i.id, nome: i.nome, prefixo: i.prefixo, instagram: i.instagram, whatsapp: i.whatsapp, loja_id: loja.id, sabado_id: i.sabado_id, lote: i.lote, meta: i.meta, ativo: i.ativo, etapa: i.etapa, notas: i.notas });
            fechar(); toast(novas.length ? `Loja salva · ${novas.length} influencer(s) ligada(s)` : "Loja salva"); render();
          } catch (err) { btn.disabled = false; m.querySelector("#l-msg").innerHTML = `<div class="aviso erro">${esc(err.message)}</div>`; }
        });
      });
    }
  }

        <div class="acoes-pag"><a class="btn sec" href="${link("balcao")}" data-ir>Consulta do cupom</a><button class="btn" id="lj-ed" type="button">Editar</button></div>

        <div class="painel"><h2>Influencers desta loja</h2>${infs.length ? listaRank(infs) : `<p class="muted">Nenhuma influencer nesta loja. Cadastre em Influencers.</p>`}</div>

  // ---------- caixa (PDV) e Rock ----------
  function importador(el, pref, colunas, exemplo, chamar, rotulo) {
    const arq = el.querySelector(`#${pref}-arq`);
    arq.onchange = () => { const fl = arq.files[0]; if (!fl) return; lerArquivo(fl).then((t) => (el.querySelector(`#${pref}-txt`).value = t)).catch((e) => toast(e.message)); };
    el.querySelector(`#${pref}-ok`).onclick = async () => {
      const linhas = el.querySelector(`#${pref}-txt`).value.split(/\n/).map((x) => x.split(/[;\t]/).map((y) => y.trim())).filter((p) => p[0] && /\d/.test(p.join("")) && !/^cupom$|^cpf$/i.test(p[0]))
        .map((p) => Object.fromEntries(colunas.map((c, k) => [c, p[k] || ""])));
      const msg = el.querySelector(`#${pref}-msg`);
      if (!linhas.length) { msg.innerHTML = `<div class="aviso erro">Cole pelo menos uma linha.</div>`; return; }
      try {
        const r = await chamar(linhas);
        msg.innerHTML = `<div class="aviso ${r.recusadas || r.sem_cupom ? "alerta" : "ok"}">${r.usados} cupons com baixa · ${r.ja_usados} já estavam usados · ${r.sem_cupom} ${rotulo} · ${r.recusadas} recusadas${r.detalhes.length ? "<br>" + r.detalhes.slice(0, 12).map(esc).join("<br>") : ""}</div>`;
        if (r.usados) toast(`${r.usados} cupons com baixa`);
      } catch (err) { msg.innerHTML = `<div class="aviso erro">${esc(err.message)}</div>`; }
    };
  }
