# Sábado Premiado · pilha completa num servidor da GTO (Linux com Docker)
# Sobe: banco PostgreSQL 16, API (PostgREST) e o site (nginx). O HTTPS fica no proxy/certificado da GTO na frente da porta 8080.
# Antes: criar o arquivo .env com as duas senhas (cp .env.exemplo .env e trocar os valores). Nada mais precisa ser editado neste arquivo.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sabado
      POSTGRES_USER: sabado_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?crie o arquivo .env (veja .env.exemplo)}
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD:?crie o arquivo .env (veja .env.exemplo)}
      TZ: America/Sao_Paulo
    command: ["postgres", "-c", "timezone=America/Sao_Paulo", "-c", "max_connections=200", "-c", "shared_buffers=256MB", "-c", "log_min_duration_statement=2000", "-c", "log_parameter_max_length=0", "-c", "log_parameter_max_length_on_error=0"]
    shm_size: 256mb
    volumes:
      - dados:/var/lib/postgresql/data
      - ./00-preparar-postgres.sql:/preparar.sql.tpl:ro
      - ./00-preparar.sh:/docker-entrypoint-initdb.d/00-preparar.sh:ro
      - ../supabase/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../supabase/lojas-gto.sql:/docker-entrypoint-initdb.d/02-lojas.sql:ro
      - ../supabase/migracoes:/migracoes:ro
      - ./aplicar-migracoes.sh:/docker-entrypoint-initdb.d/03-migracoes.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sabado_admin -d sabado"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    # sem porta publicada: o banco só é acessível pela API, dentro da rede do Docker

  api:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD:?crie o arquivo .env (veja .env.exemplo)}@db:5432/sabado
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_POOL: "30"
      PGRST_DB_POOL_ACQUISITION_TIMEOUT: "10"
      PGRST_DB_CHANNEL_ENABLED: "true"
      PGRST_OPENAPI_MODE: disabled
      PGRST_LOG_LEVEL: warn
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  site:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "8080:80"
    volumes:
      - ../publicar:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /var/cache/nginx/lp
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

volumes:
  dados:
