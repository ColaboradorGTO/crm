# Sábado Premiado · nginx: site estático + API no mesmo domínio (/api), sem CORS.
# Validar antes de subir:  docker compose run --rm site nginx -t
#
# Proteções (valores pensados para o pico de um vídeo de influencer e para a segurança dos PINs):
#  - página da influencer (lp_info) fica em cache por 5 s: mil acessos por segundo viram 1 consulta ao banco por influencer;
#    se o banco ou a API cair, o nginx segue entregando a última página boa
#  - cadastro (cadastrar): até 20 por segundo por IP, com fila de 100
#  - CRM e balcão (adm_*, balcao_*, backup_*): 3 por segundo por IP, contra tentativa de adivinhar PIN e senha
#  - importações grandes do CRM: corpo de até 25 MB

limit_req_zone $binary_remote_addr zone=pub:10m  rate=20r/s;
limit_req_zone $binary_remote_addr zone=priv:10m rate=3r/s;
limit_req_status 429;
proxy_cache_path /var/cache/nginx/lp levels=1:2 keys_zone=lp:5m max_size=50m inactive=2m use_temp_path=off;

# se existir um balanceador ou proxy da GTO na frente deste nginx, descomente e ajuste a faixa dele:
# set_real_ip_from 10.0.0.0/8;
# real_ip_header X-Forwarded-For;
# real_ip_recursive on;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 25m;
  client_body_timeout 60s;
  keepalive_timeout 30s;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Robots-Tag "noindex, nofollow" always;

  # ---- API (PostgREST): só POST nas funções, e GET só na página da influencer ----
  location = /api/rpc/lp_info {
    limit_req zone=pub burst=200 nodelay;
    limit_except GET { deny all; }
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_cache lp;
    proxy_cache_key "$request_uri";
    proxy_cache_valid 200 5s;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    add_header X-Cache $upstream_cache_status always;
  }

  # ajustes de conteúdo salvos pela V4 (config_publica): leitura pública, cache curto
  location = /api/rpc/config_publica {
    limit_req zone=pub burst=200 nodelay;
    limit_except GET { deny all; }
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    proxy_cache lp;
    proxy_cache_key "$request_uri";
    proxy_cache_valid 200 30s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
  }

  location = /api/rpc/cadastrar {
    limit_req zone=pub burst=100 nodelay;
    limit_except POST { deny all; }
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  # CRM, balcão, backup e API de relatórios: tudo que pede PIN, senha ou chave
  location ~ ^/api/rpc/(adm_|balcao_|backup_|api_) {
    limit_req zone=priv burst=60 nodelay;
    limit_except POST { deny all; }
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  # qualquer outro caminho da API não existe (as tabelas nunca ficam expostas)
  location /api/ { return 404; }

  # ---- site ----
  location ~* \.(js|css)$ {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # /ana, /crm/visao, /balcao... caem todos no index.html (o app decide a tela)
  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri /index.html;
  }
}
